name: Evaluation (live model)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-live-model
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: live-evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.0

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Evaluate the live model
        env:
          AI_GATEWAY_ACCOUNT_ID: ${{ vars.AI_GATEWAY_ACCOUNT_ID }}
          AI_GATEWAY_API_TOKEN: ${{ secrets.AI_GATEWAY_API_TOKEN }}
          AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID }}
          AI_MODEL_ID: ${{ vars.AI_MODEL_ID }}
          EVALUATION_REPORT_PATH: ${{ github.workspace }}/artifacts/evaluation/live-model.json
        run: pnpm --filter @holon/evaluation evaluate:live

      - name: Upload the evaluation report
        if: ${{ always() && hashFiles('artifacts/evaluation/live-model.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluation-live-${{ github.run_id }}-${{ github.sha }}
          path: ${{ github.workspace }}/artifacts/evaluation/live-model.json
          retention-days: 30
