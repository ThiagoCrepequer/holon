name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers for dashboard viability proof
        run: pnpm --filter @holon/dashboard-browser-proof exec playwright install --with-deps chromium firefox webkit

      - name: Verify formatting, lint, types, coverage and bundles
        run: pnpm verify

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-and-coverage-results
          path: |
            **/coverage/lcov.info
            **/junit.xml
            tooling/dashboard-browser-proof/proof-results/
          retention-days: 7
