name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Cold Linux M7 browser matrix took 18.8m; retain time for coverage and Sandbox build.
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers for dashboard gates
        run: pnpm --filter @holon/dashboard exec playwright install --with-deps chromium firefox webkit

      - name: Report verification resource budget
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { availableParallelism, totalmem } from "node:os";
          const config = JSON.parse(readFileSync("turbo.json", "utf8"));
          console.log(JSON.stringify({
            logicalProcessors: availableParallelism(),
            memoryMiB: Math.floor(totalmem() / 1024 ** 2),
            taskConcurrency: config.concurrency,
          }));
          NODE

      - name: Verify formatting, lint, types, coverage and bundles
        run: pnpm verify

      - name: Freeze the verified local artifact by SHA
        run: node tooling/deploy/dashboard-artifact-cli.mjs "$(git rev-parse HEAD)" local proof-results/release-artifact

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-and-coverage-results
          path: |
            **/coverage/**/lcov.info
            **/junit*.xml
            **/proof-results/
          retention-days: 7
